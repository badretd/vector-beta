name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - id: check
        name: Check tag and version
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a release tag. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          version="${tag#v}"
          code_version="$(python -c 'import vector; print(vector.__version__)')"
          if [[ "$version" != "$code_version" ]]; then
            echo "::error::Tag version '$version' does not match vector.__version__ '$code_version'."
            echo "Bump vector/__init__.py before tagging."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  build-windows:
    name: Windows x64
    needs: [validate, test]
    runs-on: windows-latest
    env:
      VECTOR_VERSION: ${{ needs.validate.outputs.version }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean packaging/vector.spec

      - name: Self-test
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "vector-data"
          $proc = Start-Process -FilePath "dist\Vector\Vector.exe" `
            -ArgumentList @("--self-test", "--data-dir", $data) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Self-test exited with code $($proc.ExitCode)"
          }
          Get-Content (Join-Path $data "self-test.json")

      - name: Sign executable
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "vector.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe was not found" }
          & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 "dist\Vector\Vector.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signing Vector.exe failed" }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found" }
          & $iscc "packaging\windows\vector.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Sign installer
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          Get-ChildItem "dist\installer\*.exe" | ForEach-Object {
            & $env:SIGNTOOL sign /fd SHA256 /f "$env:RUNNER_TEMP\vector.pfx" `
              /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com `
              /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing $($_.Name) failed" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/installer/*.exe
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }}
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14 images were retired on 2026-11-02. macOS 15 is the current
          # arm64 image; macos-15-intel is its x86_64 counterpart.
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VECTOR_VERSION: ${{ needs.validate.outputs.version }}
      MATRIX_ARCH: ${{ matrix.arch }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      MACOS_ENTITLEMENTS: ${{ github.workspace }}/packaging/macos/entitlements.plist
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/vector-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/vector.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/vector.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" "$keychain"

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean packaging/vector.spec

      - name: Self-test
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/vector-data"
          "dist/Vector.app/Contents/MacOS/Vector" --self-test --data-dir "$data"
          cat "$data/self-test.json"

      - name: Verify signature
        if: env.MACOS_CERT_P12 != ''
        shell: bash
        run: codesign --verify --deep --strict --verbose=2 "dist/Vector.app"

      - name: Build DMG
        shell: bash
        run: |
          set -euo pipefail
          hdiutil create -volname "Vector $VECTOR_VERSION" \
            -srcfolder "dist/Vector.app" -ov -format UDZO \
            "dist/Vector-${VECTOR_VERSION}-macos-${MATRIX_ARCH}.dmg"

      - name: Sign and notarize DMG
        if: env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          dmg="dist/Vector-${VECTOR_VERSION}-macos-${MATRIX_ARCH}.dmg"
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$dmg"
          if [[ -n "${APPLE_API_KEY_P8:-}" ]]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool submit "$dmg" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" --wait
            xcrun stapler staple "$dmg"
          else
            echo "::warning::Apple notarization secrets are missing; the DMG is signed but not notarized."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  build-linux:
    name: Linux x86_64
    needs: [validate, test]
    runs-on: ubuntu-22.04
    env:
      VECTOR_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean packaging/vector.spec

      - name: Self-test
        shell: bash
        run: |
          set -euo pipefail
          data="$RUNNER_TEMP/vector-data"
          "dist/Vector/Vector" --self-test --data-dir "$data"
          cat "$data/self-test.json"

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf "dist/Vector-${VECTOR_VERSION}-linux-x86_64.tar.gz" Vector

      - name: Download appimagetool
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          curl -fsSL "$url" -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
        run: packaging/linux/build_appimage.sh "$VECTOR_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.AppImage
            dist/*-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [validate, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - name: Select release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          path="docs/releases/${{ needs.validate.outputs.version }}.md"
          if [[ -f "$path" ]]; then
            echo "body_path=$path" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vector ${{ needs.validate.outputs.version }}
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          files: release/*
